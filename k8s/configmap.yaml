apiVersion: v1
kind: ConfigMap
metadata:
  name: malscan-config
  namespace: malscan
data:
  MINIO_ENDPOINT: "minio.malscan.svc.cluster.local:9000"
  MINIO_BUCKET_UPLOADS: "uploads"
  MINIO_BUCKET_ARTIFACTS: "artifacts"
  MINIO_SECURE: "false"
  RABBITMQ_HOST: "rabbitmq.malscan.svc.cluster.local"
  RABBITMQ_QUEUE: "malscan.jobs"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  STAGES_TOTAL: "9"
  UPLOAD_RATE_LIMIT_ENABLED: "true"
  UPLOAD_RATE_LIMIT_RPM: "6"
  UPLOAD_RATE_LIMIT_BURST: "2"
  UPLOAD_AUTH_ENABLED: "false"
  SANDBOX_ENABLED: "false"
  # Legacy provider fallback only; when sandbox is disabled, mock analysis is not run.
  SANDBOX_MOCK: "true"
  YARA_RULES_PATH: "/etc/yara/rules"
  CLAMAV_HOST: "clamav"
  CLAMAV_PORT: "3310"
  STAGE_TIMEOUT_SECONDS: "300"
  METRICS_PORT: "9090"
