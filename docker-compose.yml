version: '3.8'

services:
  # PostgreSQL - Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: malscan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - Object Storage
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # RabbitMQ - Message Queue
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ClamAV - AntiVirus Daemon (Offline Support)
  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"
    environment:
      # Disable freshclam for offline environment compatibility
      - CLAMAV_NO_FRESHCLAMD=true
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # API Server
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/malscan}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      - postgres
      - minio
      - rabbitmq

  # Worker
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/malscan}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_SANDBOX_QUEUE: malscan.jobs.sandbox
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-mock}
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL:-}
      SANDBOX_API_TOKEN: ${SANDBOX_API_TOKEN:-}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-900}
      SANDBOX_POLL_INTERVAL_SECONDS: ${SANDBOX_POLL_INTERVAL_SECONDS:-10}
      SANDBOX_ENABLE_URL_SUBMISSION: ${SANDBOX_ENABLE_URL_SUBMISSION:-false}
    depends_on:
      - postgres
      - minio
      - rabbitmq
      - clamav

  sandbox-worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    command: ["python", "-m", "malscan_worker.sandbox_main"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/malscan}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_SANDBOX_QUEUE: malscan.jobs.sandbox
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-mock}
      SANDBOX_BASE_URL: ${SANDBOX_BASE_URL:-}
      SANDBOX_API_TOKEN: ${SANDBOX_API_TOKEN:-}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-900}
      SANDBOX_POLL_INTERVAL_SECONDS: ${SANDBOX_POLL_INTERVAL_SECONDS:-10}
      SANDBOX_ENABLE_URL_SUBMISSION: ${SANDBOX_ENABLE_URL_SUBMISSION:-false}
    depends_on:
      - postgres
      - minio
      - rabbitmq
      - clamav

  # Go Ingest Service — replaces POST /api/v1/files
  ingest:
    build:
      context: ./ingest
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/malscan}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PORT: 8080
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Nginx Reverse Proxy — routes POST /api/v1/files to Go, everything else to FastAPI
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ingest

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
  clamav_data:
