name: Ingest CI

on:
  push:
    branches: [main]
    paths:
      - 'ingest/**'
      - '.github/workflows/ingest.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ingest/**'
      - '.github/workflows/ingest.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ingest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ingest/go.mod
          cache-dependency-path: ingest/go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...
